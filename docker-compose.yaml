name: rex-crm

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: rex-crm-app:dev
  volumes:
    - .:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy

# Service names differ from the generic "app"/"queue" so they cannot collide with
# containers from another Compose project that also uses the name "rex-crm".
services:
  rex-crm:
    <<: *app
    container_name: rex-crm
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rex-crm-queue:
    <<: *app
    container_name: rex-crm-queue
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=60"]

  postgres:
    image: postgres:18-alpine
    container_name: rex-crm-pgsql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rex_crm}
      POSTGRES_USER: ${DB_USERNAME:-rex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
